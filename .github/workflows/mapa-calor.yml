name: Mapas de calor de AEMET

# Descarga la climatología diaria de una estación y deja commiteados en
# resultados/ (y como artefacto descargable) dos mapas: el recuento de días
# que superan un umbral y la anomalía mensual frente a la normal climática.

on:
  workflow_dispatch:
    inputs:
      estacion:
        description: "Indicativo de la estación de AEMET"
        default: "8500A"
      desde:
        description: "Año o fecha de inicio (1990 o 1990-01-01)"
        default: "1990"
      hasta:
        description: "Año o fecha de fin (vacío = hoy)"
        default: ""
      variable:
        description: "Temperatura del día a analizar"
        type: choice
        options: [tmin, tmax]
        default: tmin
      umbral:
        description: "Grados del umbral"
        default: "20"
      estricto:
        description: "Contar > umbral en vez de >= umbral"
        type: boolean
        default: false
      credito:
        description: "Firma al pie del gráfico"
        default: "Gráfico: poloi@eurosky.social"
      anomalias:
        description: "Dibujar también el mapa de anomalías"
        type: boolean
        default: true
      destacar:
        description: "Años a resaltar en el gráfico de líneas (vacío = los dos últimos)"
        default: ""
      suavizado:
        description: "Días de la media móvil en el gráfico diario suavizado"
        default: "7"
      commitear:
        description: "Guardar los resultados en el repo"
        type: boolean
        default: true
  schedule:
    # Día 3 de cada mes. Ojo: GitHub solo lanza los cron de la rama por defecto.
    - cron: "17 5 3 * *"

permissions:
  contents: write

concurrency:
  group: mapa-calor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mapa:
    runs-on: ubuntu-latest
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      ESTACION: ${{ inputs.estacion || '8500A' }}
      DESDE: ${{ inputs.desde || '1990' }}
      HASTA: ${{ inputs.hasta }}
      UMBRAL: ${{ inputs.umbral || '20' }}
      VARIABLE: ${{ inputs.variable || 'tmin' }}
      CREDITO: "${{ inputs.credito || 'Gráfico: poloi@eurosky.social' }}"
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que está la clave de AEMET
        run: |
          if [ -z "$AEMET_API_KEY" ]; then
            echo "::error::Falta el secreto AEMET_API_KEY. Añádelo en Settings → \
          Secrets and variables → Actions → New repository secret. La clave se \
          pide gratis en https://opendata.aemet.es/centrodedescargas/altaUsuario"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar la descarga cacheada
        uses: actions/cache@v4
        with:
          path: datos/crudos
          key: aemet-${{ env.ESTACION }}-${{ github.run_id }}
          restore-keys: aemet-${{ env.ESTACION }}-

      - name: Carpeta de salida según el umbral
        env:
          ESTRICTO: ${{ inputs.estricto }}
        run: |
          set -euo pipefail
          # Cada umbral tiene su carpeta, así una tirada no pisa la anterior.
          if [ "$VARIABLE" = "tmax" ]; then slug="tmax${UMBRAL//./_}"; else slug="min${UMBRAL//./_}"; fi
          if [ "$ESTRICTO" = "true" ]; then slug="$slug-estricto"; fi
          echo "SALIDA=resultados/$slug" >> "$GITHUB_ENV"
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Descargar de AEMET y calcular
        env:
          ESTRICTO: ${{ inputs.estricto }}
        run: |
          set -euo pipefail
          mkdir -p "$SALIDA"
          args=(--estacion "$ESTACION" --umbral "$UMBRAL" --variable "$VARIABLE")
          if [ "$ESTRICTO" = "true" ]; then args+=(--estricto); fi
          fechas=(--desde "$DESDE")
          if [ -n "$HASTA" ]; then fechas+=(--hasta "$HASTA"); fi
          python -m aemet_noches descargar --estacion "$ESTACION" "${fechas[@]}"
          python -m aemet_noches calcular "${args[@]}" "${fechas[@]}" \
            --csv "$SALIDA/datos.csv" | tee "$SALIDA/resumen.txt"

      - name: Dibujar el mapa de calor (claro y oscuro)
        env:
          ESTRICTO: ${{ inputs.estricto }}
        run: |
          set -euo pipefail
          args=(--estacion "$ESTACION" --umbral "$UMBRAL" --variable "$VARIABLE" --credito "$CREDITO")
          if [ "$ESTRICTO" = "true" ]; then args+=(--estricto); fi
          for tema in claro oscuro; do
            python -m aemet_noches mapa "${args[@]}" \
              --csv "$SALIDA/datos.csv" \
              --png "$SALIDA/mapa_$tema.png" --tema "$tema"
          done

      - name: Mapa de anomalías
        if: ${{ inputs.anomalias != false }}
        run: |
          set -euo pipefail
          destino="resultados/anomalias_$VARIABLE"
          mkdir -p "$destino"
          fechas=(--desde "$DESDE")
          if [ -n "$HASTA" ]; then fechas+=(--hasta "$HASTA"); fi
          python -m aemet_noches anomalias \
            --estacion "$ESTACION" --variable "$VARIABLE" "${fechas[@]}" \
            --credito "$CREDITO" --temas claro oscuro \
            --csv "$destino/datos.csv" --png "$destino/mapa_{tema}.png" \
            | tee "$destino/resumen.txt"

      - name: Gráfico de líneas
        env:
          DESTACAR: ${{ inputs.destacar }}
          SUAVIZADO: ${{ inputs.suavizado || '7' }}
        run: |
          set -euo pipefail
          destino="resultados/lineas_$VARIABLE"
          mkdir -p "$destino"
          args=(--estacion "$ESTACION" --variable "$VARIABLE" --credito "$CREDITO")
          if [ -n "$DESTACAR" ]; then args+=(--destacar $DESTACAR); fi
          if [ -n "$HASTA" ]; then args+=(--hasta "$HASTA"); fi
          args+=(--desde "$DESDE" --temas claro oscuro)
          # Las tres lecturas del mismo dato: mes a mes, día a día, y día a día
          # con media móvil, que es la única legible con dos años encima.
          python -m aemet_noches lineas "${args[@]}" --resolucion mensual \
            --png "$destino/mensual_{tema}.png"
          python -m aemet_noches lineas "${args[@]}" --resolucion diaria \
            --png "$destino/diaria_{tema}.png"
          python -m aemet_noches lineas "${args[@]}" --resolucion diaria \
            --suavizado "${SUAVIZADO:-7}" --png "$destino/diaria_suave_{tema}.png"

      - name: Resumen en la pestaña del run
        run: |
          {
            echo "## Estación $ESTACION — umbral $UMBRAL °C"
            echo '```'
            tail -n 45 "$SALIDA/resumen.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mapa-calor-${{ env.ESTACION }}-${{ env.SLUG }}
          path: |
            ${{ env.SALIDA }}/
            resultados/anomalias_${{ env.VARIABLE }}/
            resultados/lineas_${{ env.VARIABLE }}/
          if-no-files-found: error

      - name: Commitear los resultados
        if: ${{ inputs.commitear != false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rutas=("$SALIDA")
          for extra in "resultados/anomalias_$VARIABLE" "resultados/lineas_$VARIABLE"; do
            if [ -d "$extra" ]; then rutas+=("$extra"); fi
          done
          git add -f "${rutas[@]}"
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados."
            exit 0
          fi
          git commit -m "Resultados: $ESTACION, $VARIABLE >= $UMBRAL °C ($DESDE→${HASTA:-hoy})"
          for intento in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** intento))
          done
          echo "::error::No se pudieron subir los resultados"
          exit 1
