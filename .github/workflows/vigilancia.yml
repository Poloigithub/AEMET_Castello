name: Vigilancia diaria del top 10

# Mira cada día si ha entrado una temperatura nueva en la clasificación, en
# dos trabajos paralelos: uno vigila las mínimas y otro las máximas.
# Si no hay novedad no envía nada ni commitea: el silencio es el caso normal.

on:
  workflow_dispatch:
    inputs:
      forzar_envio:
        description: "Enviar la tabla aunque no haya entradas nuevas (para probar)"
        type: boolean
        default: false
  schedule:
    # A diario. AEMET publica los valores diarios con unos días de retraso,
    # así que el aviso llega cuando el dato está validado, no la misma noche.
    - cron: "40 6 * * *"

permissions:
  contents: write

concurrency:
  group: vigilancia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    strategy:
      # Los dos rankings van en paralelo. Cada trabajo toca solo sus propios
      # ficheros, así que aunque coincidan al hacer push no hay conflicto.
      fail-fast: false
      matrix:
        variable: [tmin, tmax]
    name: vigilar ${{ matrix.variable }}
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      ESTACION: "8500A"
      DESDE: "1990"
      VARIABLE: ${{ matrix.variable }}
      CREDITO: "Gráfico: poloi@eurosky.social"
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que está la clave de AEMET
        id: clave
        run: |
          if [ -z "$AEMET_API_KEY" ]; then
            echo "::error::Falta el secreto AEMET_API_KEY."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar la descarga cacheada
        uses: actions/cache@v4
        with:
          path: datos/crudos
          key: aemet-${{ env.ESTACION }}-${{ matrix.variable }}-${{ github.run_id }}
          restore-keys: aemet-${{ env.ESTACION }}-

      - name: Guardar el ranking anterior
        run: |
          set -euo pipefail
          anterior="resultados/rankings/top10_$VARIABLE.csv"
          if [ -f "$anterior" ]; then
            cp "$anterior" /tmp/antes.csv
            echo "Ranking anterior guardado."
          else
            echo "Todavía no hay ranking anterior; esta tirada solo crea la base."
          fi

      - name: Actualizar los datos y recalcular el top
        id: datos
        run: |
          set -euo pipefail
          mkdir -p resultados/rankings
          # El tramo en curso se vuelve a pedir solo; el resto sale de la caché.
          python -m aemet_noches descargar --estacion "$ESTACION" --desde "$DESDE" 2>&1 | tee /tmp/aemet.log
          python -m aemet_noches extremos \
            --estacion "$ESTACION" --variable "$VARIABLE" --desde "$DESDE" --top 10 \
            --credito "$CREDITO" --temas claro oscuro \
            --csv "resultados/rankings/top10_$VARIABLE.csv" \
            --png "resultados/rankings/top10_${VARIABLE}_{tema}.png" \
            | tee "resultados/rankings/top10_$VARIABLE.txt"

      - name: Hasta qué día llegan los datos
        id: cobertura
        run: |
          set -euo pipefail
          ultimo=$(python -m aemet_noches ultimo --variable "$VARIABLE")
          echo "Datos publicados hasta: $ultimo"
          echo "ultimo=$ultimo" >> "$GITHUB_OUTPUT"

      - name: ¿Ha entrado algo nuevo?
        id: comparar
        run: |
          python scripts/vigilar_top.py --variable "$VARIABLE" \
            --antes /tmp/antes.csv \
            --despues "resultados/rankings/top10_$VARIABLE.csv"

      - name: Avisar por Telegram
        if: ${{ steps.comparar.outputs.nuevas != '0' || inputs.forzar_envio }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          AVISO: ${{ steps.comparar.outputs.texto }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Sin credenciales de Telegram: no se envía el aviso."
            exit 0
          fi
          texto="${AVISO:-Tabla del top 10 (envío forzado, sin novedades).}"
          texto="$texto"$'\n\n'"Datos de AEMET publicados hasta el ${{ steps.cobertura.outputs.ultimo }}."
          python scripts/telegram.py --texto "$texto" \
            "resultados/rankings/top10_${VARIABLE}_claro.png"

      - name: Guardar el nuevo ranking en el repo
        if: ${{ steps.comparar.outputs.nuevas != '0' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "resultados/rankings/top10_$VARIABLE."* \
            "resultados/rankings/top10_${VARIABLE}_"*.png
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Nueva entrada en el top 10 de $VARIABLE ($ESTACION)"
          for intento in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** intento))
          done
          echo "::error::No se pudo subir el ranking actualizado"
          exit 1

      - name: Resumen
        run: |
          {
            echo "## Vigilancia del top 10 ($VARIABLE)"
            echo ""
            echo "Datos hasta el ${{ steps.cobertura.outputs.ultimo }}."
            echo ""
            if [ "${{ steps.comparar.outputs.nuevas }}" = "0" ]; then
              echo "Sin novedades."
            else
              echo "**${{ steps.comparar.outputs.nuevas }} entrada(s) nueva(s).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar del fallo por Telegram
        if: failure()
        continue-on-error: true   # si el aviso falla, no enmascara el fallo real
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          FALLO_CLAVE: ${{ steps.clave.outcome }}
          FALLO_DATOS: ${{ steps.datos.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Sin credenciales de Telegram: no se avisa del fallo."
            exit 0
          fi
          enlace="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$FALLO_CLAVE" = "failure" ]; then
            motivo="Falta el secreto AEMET_API_KEY en el repositorio."
            arreglo="Añádelo en Settings → Secrets and variables → Actions."
          elif [ "$FALLO_DATOS" = "failure" ]; then
            motivo="Ha fallado la petición a AEMET."
            if [ -f /tmp/aemet.log ]; then
              # Mejor citar lo que dijo AEMET que adivinar la causa.
              motivo="$motivo"$'\n'"$(grep -i 'AEMET respondió\|Error\|contactar' /tmp/aemet.log | tail -2)"
            fi
            arreglo="Si habla de la clave, pide una nueva en https://opendata.aemet.es/centrodedescargas/altaUsuario y actualiza el secreto AEMET_API_KEY. Si no, mira el log del run."
          else
            motivo="Ha fallado un paso del workflow, y no ha sido la descarga de AEMET."
            arreglo="Mira el log del run para ver qué ha pasado."
          fi
          texto="⛔ Vigilancia diaria ($VARIABLE): la tirada ha fallado."$'\n\n'"$motivo"$'\n\n'"$arreglo"$'\n\n'"Run: $enlace"
          python scripts/telegram.py --texto "$texto"
